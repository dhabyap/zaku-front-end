<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">

  <!-- bg hitam -->
  <rect width="64" height="64" fill="#0E0E0E"/>

  <!-- border kuning offset (neobrutalism shadow) -->
  <rect x="5" y="5" width="54" height="54" fill="none" stroke="#FFD600" stroke-width="2.5"/>

  <!-- inner fill -->
  <rect x="2" y="2" width="54" height="54" fill="#0E0E0E" stroke="#FFD600" stroke-width="2.5"/>

  <!-- orange accent blok kiri atas -->
  <rect x="2" y="2" width="14" height="5" fill="#FF4800"/>

  <!-- orange accent blok kanan bawah -->
  <rect x="42" y="51" width="14" height="5" fill="#FF4800"/>

  <!-- Sayap kiri (3 garis terpisah, miring ke atas) -->
  <line x1="8" y1="38" x2="21" y2="28" stroke="#FFD600" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="33" x2="22" y2="25" stroke="#FFD600" stroke-width="2" stroke-linecap="round"/>
  <line x1="13" y1="29" x2="23" y2="23" stroke="#FFD600" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sayap kanan (3 garis terpisah, miring ke atas) -->
  <line x1="56" y1="38" x2="43" y2="28" stroke="#FFD600" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="33" x2="42" y2="25" stroke="#FFD600" stroke-width="2" stroke-linecap="round"/>
  <line x1="51" y1="29" x2="41" y2="23" stroke="#FFD600" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Uang kertas (tengah) -->
  <rect x="20" y="27" width="24" height="14" rx="2" fill="#FF4800"/>

  <!-- Symbol $ di uang -->
  <text
    x="32" y="38"
    font-family="Arial Black, sans-serif"
    font-size="13"
    font-weight="900"
    fill="#FFD600"
    text-anchor="middle"
  >$</text>

  <!-- titik oranye pojok kanan atas -->
  <rect x="48" y="6" width="6" height="6" fill="#FF4800"/>

  <!-- titik kuning pojok kiri bawah -->
  <rect x="10" y="50" width="6" height="6" fill="#FFD600" opacity="0.5"/>

</svg>
